name: Windows Build

# Windows-only build: zip bundle + setup.exe installer, no other platforms,
# no quality gate, no GitHub Release publishing.

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'windows**'

permissions:
  contents: read

concurrency:
  group: mithka-windows-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache desktop tdjson
        uses: actions/cache@v6
        with:
          path: native-libs/tdjson.dll
          key: tdjson-desktop-Windows-windows-x64-${{ hashFiles('scripts/tdjson-manifest.json') }}

      - name: Install pinned desktop tdjson
        shell: bash
        run: |
          scripts/build-tdjson-desktop.sh windows native-libs/tdjson.dll x64

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Write secrets.dart
        shell: bash
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          mkdir -p lib/config
          cat > lib/config/secrets.dart <<EOF
          class Secrets {
            static const int apiId = ${TELEGRAM_API_ID:-0};
            static const String apiHash = '${TELEGRAM_API_HASH}';
            static bool get isConfigured => apiId != 0 && apiHash.isNotEmpty;
          }
          EOF

      - name: Build Windows release
        shell: pwsh
        run: |
          $stamp = Get-Date -AsUTC -Format 'yyMMddHH'
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          flutter build windows --release --no-pub `
            --build-name="1.5.0" `
            --build-number="$stamp" `
            --dart-define="GIT_COMMIT=$shortSha" `
            --dart-define="CI_BUILD_STAMP=$stamp" `
            --dart-define="SENTRY_DSN="

      - name: Package Windows release
        shell: pwsh
        run: |
          $bundle = "build\windows\x64\runner\Release"
          Copy-Item "native-libs\tdjson.dll" "$bundle\tdjson.dll"
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeLibraryCheck {
            [DllImport("kernel32", SetLastError = true, CharSet = CharSet.Unicode)]
            public static extern IntPtr LoadLibrary(string path);
            [DllImport("kernel32", SetLastError = true)]
            public static extern IntPtr GetProcAddress(IntPtr module, string name);
            [DllImport("kernel32", SetLastError = true)]
            public static extern bool FreeLibrary(IntPtr module);
          }
          '@
          $module = [NativeLibraryCheck]::LoadLibrary((Resolve-Path "$bundle\tdjson.dll"))
          if ($module -eq [IntPtr]::Zero) {
            throw "Could not load packaged tdjson.dll: $([Runtime.InteropServices.Marshal]::GetLastWin32Error())"
          }
          $requiredSymbols = @(
            "td_create_client_id",
            "td_mithka_export_session_string",
            "td_mithka_import_session_string",
            "td_mithka_last_error",
            "td_mithka_set_transfer_boost"
          )
          foreach ($symbol in $requiredSymbols) {
            if ([NativeLibraryCheck]::GetProcAddress($module, $symbol) -eq [IntPtr]::Zero) {
              throw "Packaged tdjson.dll does not export $symbol"
            }
          }
          [void][NativeLibraryCheck]::FreeLibrary($module)
          New-Item -ItemType Directory -Force dist\package | Out-Null
          Copy-Item $bundle dist\package\Mithka -Recurse
          Compress-Archive -Path dist\package\Mithka `
            -DestinationPath "dist\mithka-windows-x64.zip"

          $installer = & scripts\build-windows-installer.ps1 `
            -Architecture "x64" `
            -BuildDirectory $bundle `
            -OutputDirectory dist `
            -Version "1.5.0" `
            -ArtifactLabel "windows-local"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Windows installer was not created: $installer"
          }
          Get-ChildItem dist

      - name: Upload Windows zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: mithka-windows-x64-zip
          path: dist/mithka-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: mithka-windows-x64-setup
          path: dist/mithka-windows-local-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 14

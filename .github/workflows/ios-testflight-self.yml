name: iOS TestFlight

# Signed iOS build uploaded to TestFlight with *this* account's Apple identity.
# Nothing about the upstream author's account is touched:
# scripts/ios-set-signing-identity.sh rewrites the checked-in team id, bundle
# ids and app group before anything is signed.
#
# Repository variables (identifiers — not secret):
#   IOS_TEAM_ID                10-character Apple team id              [required]
#   IOS_BUNDLE_ID              base bundle id you own, e.g. com.example.mithka
#                                                                      [required]
#   IOS_APP_STORE_ID           numeric App Store Connect app id for that bundle id
#                              (App Store Connect → your app → App Information)
#                                                                      [required]
#   IOS_APP_GROUP              defaults to group.<IOS_BUNDLE_ID>.notifications
#   IOS_APP_DISPLAY_NAME       optional; renames the app on the device (the icon
#                              label) without touching the repository default
#   IOS_PROFILE_APP            name of the App Store provisioning profile for the
#                              app bundle id                        [required]
#   IOS_PROFILE_EXTENSION      name of the App Store profile for the notification
#                              service extension                    [required]
#   IOS_STRIP_ENTITLEMENTS     entitlements to drop; defaults to
#                              com.apple.developer.private-cloud-compute
#                              (Apple grants that one only on request). Use the
#                              literal value `none` to keep everything.
#   TESTFLIGHT_INTERNAL_GROUP  defaults to 'Internal'
#   TESTFLIGHT_EXTERNAL_GROUP  optional; leave empty for internal testers only
#                              (external testers need a pre-created group and
#                              pass Beta App Review)
#
# Repository secrets:
#   APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID /
#   APP_STORE_CONNECT_PRIVATE_KEY      App Store Connect API key (.p8 contents)
#   IOS_SIGNING_CERTIFICATE_P12 (base64) / IOS_SIGNING_CERTIFICATE_PASSWORD
#                                      optional Apple Distribution certificate.
#                                      Without it xcodebuild asks App Store
#                                      Connect to create one on the runner.
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Sign and archive only; do not upload to App Store Connect'
        type: boolean
        default: false

concurrency:
  group: mithka-ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    name: Sign, upload and distribute
    runs-on: macos-26
    timeout-minutes: 180
    env:
      MITHKA_CI_PLATFORM: ios
      # Build tdjson.xcframework from verified upstream source + the vendored
      # patch set instead of downloading the author's prebuilt binary.
      TDJSON_FROM_SOURCE: '1'
      # Deliberately credential-free: this fork is public, so a real api id/hash
      # compiled in here would be extractable from the binary. The app asks the
      # user for their own credentials on first run; ci_post_clone.sh only needs
      # the values non-empty.
      TELEGRAM_API_ID: '0'
      TELEGRAM_API_HASH: 'not-configured'
      SENTRY_DSN: ''
      TGVOIP_WEBRTC_XCFRAMEWORK_URL: ${{ vars.TGVOIP_WEBRTC_XCFRAMEWORK_URL }}
      TGVOIP_WEBRTC_XCFRAMEWORK_SHA256: ${{ vars.TGVOIP_WEBRTC_XCFRAMEWORK_SHA256 }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      IOS_APP_GROUP: ${{ vars.IOS_APP_GROUP }}
      IOS_STRIP_ENTITLEMENTS: ${{ vars.IOS_STRIP_ENTITLEMENTS }}
      IOS_APP_DISPLAY_NAME: ${{ vars.IOS_APP_DISPLAY_NAME }}
      IOS_PROFILE_APP: ${{ vars.IOS_PROFILE_APP }}
      IOS_PROFILE_EXTENSION: ${{ vars.IOS_PROFILE_EXTENSION }}
      APP_STORE_ID: ${{ vars.IOS_APP_STORE_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require identifier configuration
        run: |
          set -euo pipefail
          missing=""
          [ -n "${IOS_TEAM_ID:-}" ] || missing="$missing repository variable IOS_TEAM_ID;"
          [ -n "${IOS_BUNDLE_ID:-}" ] || missing="$missing repository variable IOS_BUNDLE_ID;"
          [ -n "${ASC_KEY_ID:-}" ] || missing="$missing secret APP_STORE_CONNECT_KEY_ID;"
          [ -n "${ASC_ISSUER_ID:-}" ] || missing="$missing secret APP_STORE_CONNECT_ISSUER_ID;"
          if [ -n "$missing" ]; then
            printf '::error::missing configuration:%s\n' "$missing"
            exit 1
          fi
          echo "▸ team=$IOS_TEAM_ID bundle=$IOS_BUNDLE_ID app_store_id=${APP_STORE_ID:-<unset>}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' | sort -V | tail -1)"
          test -n "$xcode_path"
          echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"

      - name: Prepare App Store Connect credential
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${PRIVATE_KEY:?missing APP_STORE_CONNECT_PRIVATE_KEY}"
          key_directory="$RUNNER_TEMP/app-store-connect"
          key_path="$key_directory/AuthKey_${ASC_KEY_ID}.p8"
          mkdir -p "$key_directory"
          chmod 700 "$key_directory"
          umask 077
          printf '%s' "$PRIVATE_KEY" > "$key_path"
          openssl pkey -in "$key_path" -noout -check >/dev/null
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Import distribution certificate
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.IOS_SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.IOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          # Manual signing below needs this identity in the keychain; the
          # certificate and the profiles are created by scripts/make-ios-signing-assets.py
          # from the App Store Connect API, so nothing is tied to a Mac.
          : "${SIGNING_CERTIFICATE_P12:?missing IOS_SIGNING_CERTIFICATE_P12}"
          : "${SIGNING_CERTIFICATE_PASSWORD:?missing IOS_SIGNING_CERTIFICATE_PASSWORD}"
          signing_keychain="$RUNNER_TEMP/mithka-signing.keychain-db"
          signing_p12="$RUNNER_TEMP/mithka-signing.p12"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$SIGNING_CERTIFICATE_P12" | base64 --decode > "$signing_p12"
          security create-keychain -p "$keychain_password" "$signing_keychain"
          security set-keychain-settings -lut 21600 "$signing_keychain"
          security unlock-keychain -p "$keychain_password" "$signing_keychain"
          security import "$signing_p12" \
            -k "$signing_keychain" \
            -P "$SIGNING_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$signing_keychain" >/dev/null
          security list-keychains -d user -s "$signing_keychain"
          security find-identity -v -p codesigning "$signing_keychain" | grep -q 'valid identities found'
          {
            echo "CI_SIGNING_KEYCHAIN=$signing_keychain"
            echo "CI_SIGNING_P12=$signing_p12"
          } >> "$GITHUB_ENV"

      - name: Install provisioning profiles
        env:
          PROFILE_APP: ${{ secrets.IOS_PROVISIONING_PROFILE_APP }}
          PROFILE_EXTENSION: ${{ secrets.IOS_PROVISIONING_PROFILE_EXTENSION }}
        run: |
          set -euo pipefail
          : "${PROFILE_APP:?missing IOS_PROVISIONING_PROFILE_APP}"
          : "${PROFILE_EXTENSION:?missing IOS_PROVISIONING_PROFILE_EXTENSION}"
          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          for pair in "app:$PROFILE_APP" "extension:$PROFILE_EXTENSION"; do
            label="${pair%%:*}"
            content="${pair#*:}"
            target="$RUNNER_TEMP/$label.mobileprovision"
            printf '%s' "$content" | base64 --decode > "$target"
            uuid="$(security cms -D -i "$target" | plutil -extract UUID raw -)"
            name="$(security cms -D -i "$target" | plutil -extract Name raw -)"
            bundle="$(security cms -D -i "$target" | plutil -extract Entitlements.application-identifier raw -)"
            cp "$target" "$profile_dir/$uuid.mobileprovision"
            echo "▸ $label profile: $name ($uuid) for $bundle"
          done

      - name: Apply Apple signing identity
        run: |
          set -euo pipefail
          # Resolve the app group here so later steps can assert on it too.
          app_group="${IOS_APP_GROUP:-group.${IOS_BUNDLE_ID}.notifications}"
          echo "IOS_APP_GROUP=$app_group" >> "$GITHUB_ENV"
          bash scripts/ios-set-signing-identity.sh

      - name: Set build identity
        run: |
          set -euo pipefail
          build_number="$(sh scripts/apple_ci_build_number.sh "$GITHUB_SHA")"
          {
            echo "CI_BUILD_NUMBER=$build_number"
            echo "CI_COMMIT=$GITHUB_SHA"
            echo "CI_PRIMARY_REPOSITORY_PATH=$GITHUB_WORKSPACE"
            echo "CI_DERIVED_DATA_PATH=$RUNNER_TEMP/MithkaDerivedData"
          } >> "$GITHUB_ENV"

      - name: Install tdjson build tools
        run: brew install cmake ninja gperf

      - name: Prepare deterministic iOS build inputs
        run: |
          set -euo pipefail
          # ci_post_clone.sh requires a Firebase plist to exist. Ship a
          # deliberate placeholder: valid plist shape, but BUNDLE_ID mismatch
          # makes both the Xcode copy phase and the runtime availability check
          # skip Firebase, so no real Firebase project is needed. Add the real
          # plist as a secret and this placeholder is unused.
          placeholder="$(mktemp)"
          cat > "$placeholder" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000000000</string>
            <key>BUNDLE_ID</key>
            <string>placeholder.not.configured</string>
          </dict>
          </plist>
          PLIST
          export FIREBASE_IOS_GOOGLESERVICE_INFO_PLIST_B64="$(
            base64 < "$placeholder" | tr -d '\n'
          )"
          sh ci_scripts/ci_post_clone.sh

      - name: Verify git dependency revisions
        run: bash scripts/check-git-dep-revisions.sh

      - name: Archive iOS app
        run: |
          set -euo pipefail
          archive_path="$RUNNER_TEMP/Mithka-iOS.xcarchive"
          # ci_post_clone.sh pins MARKETING_VERSION through the upstream nightly
          # rule, which collapses a non-release branch onto X.Y.0. This build is
          # named for the version it ships, so state it explicitly.
          marketing_version="$(
            awk '/^version:/ { print $2; exit }' pubspec.yaml | cut -d+ -f1
          )"
          test -n "$marketing_version"
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -derivedDataPath "$CI_DERIVED_DATA_PATH" \
            MARKETING_VERSION="$marketing_version" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID"

          # No PROVISIONING_PROFILE_SPECIFIER on the command line: the identity
          # script already wrote one per target, and a command-line value would
          # apply the app's profile to the notification extension as well.

          app="$archive_path/Products/Applications/Runner.app"
          # Prove the identity rewrite reached the signature: an archive signed
          # by some other team (or not signed at all) must fail here, not at the
          # upload.
          signed_team="$(/usr/bin/codesign -dv --verbose=4 "$app" 2>&1 |
            awk -F= '/^TeamIdentifier=/ { print $2 }')"
          if [ "$signed_team" != "$IOS_TEAM_ID" ]; then
            echo "::error::archive is signed by '${signed_team:-nothing}', expected $IOS_TEAM_ID"
            exit 1
          fi
          if ! /usr/bin/codesign -d --entitlements :- "$app" 2>/dev/null |
            grep -q -F "$IOS_APP_GROUP"; then
            echo "::error::signed app is missing the app group $IOS_APP_GROUP"
            exit 1
          fi
          echo "✓ signed by team $signed_team, app group $IOS_APP_GROUP present"

          tdjson_dsym="$archive_path/dSYMs/tdjson.framework.dSYM"
          tdjson_binary="$app/Frameworks/tdjson.framework/tdjson"
          binary_uuid="$(/usr/bin/dwarfdump --uuid "$tdjson_binary" | awk 'NR == 1 { print $2 }')"
          dsym_uuid="$(/usr/bin/dwarfdump --uuid "$tdjson_dsym" | awk 'NR == 1 { print $2 }')"
          test -n "$binary_uuid"
          test "$dsym_uuid" = "$binary_uuid"
          echo "ARCHIVE_PATH=$archive_path" >> "$GITHUB_ENV"

      - name: Assert no build-time credentials in the binary
        run: bash scripts/check-no-embedded-credentials.sh "$ARCHIVE_PATH/Products/Applications/Runner.app"

      - name: Verify iOS marketing version
        run: |
          set -euo pipefail
          # The upstream helper collapses non-release branches onto X.Y.0 (its
          # nightly rule). A dispatch here is deliberate, so the build carries
          # the exact version from pubspec.yaml instead.
          marketing_version="$(
            awk '/^version:/ { print $2; exit }' pubspec.yaml | cut -d+ -f1
          )"
          info_plist="$ARCHIVE_PATH/Products/Applications/Runner.app/Info.plist"
          actual_version="$(plutil -extract CFBundleShortVersionString raw "$info_plist")"
          if [ "$actual_version" != "$marketing_version" ]; then
            echo "::error::expected iOS marketing version $marketing_version, got $actual_version"
            exit 1
          fi
          echo "MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"
          echo "✓ marketing version $actual_version"

      - name: Export signed IPA
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/UploadOptions-iOS.plist"
          upload_path="$RUNNER_TEMP/iOSUpload"
          plutil -create xml1 "$export_options"
          plutil -insert method -string app-store-connect "$export_options"
          plutil -insert destination -string export "$export_options"
          plutil -insert signingStyle -string manual "$export_options"
          plutil -insert teamID -string "$IOS_TEAM_ID" "$export_options"
          plutil -insert provisioningProfiles -json \
            "{\"$IOS_BUNDLE_ID\":\"$IOS_PROFILE_APP\",\"$IOS_BUNDLE_ID.NotificationService\":\"$IOS_PROFILE_EXTENSION\"}" \
            "$export_options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$export_options"
          plutil -insert stripSwiftSymbols -bool YES "$export_options"
          plutil -insert uploadSymbols -bool YES "$export_options"
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$upload_path" \
            -exportOptionsPlist "$export_options"

          ipa_count="$(find "$upload_path" -maxdepth 1 -type f -name '*.ipa' -print | wc -l | tr -d ' ')"
          test "$ipa_count" -eq 1
          ipa="$(find "$upload_path" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          echo "UPLOADED_IPA=$ipa" >> "$GITHUB_ENV"
          echo "✓ exported $(basename "$ipa")"

      - name: Upload IPA to App Store Connect
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        run: |
          set -euo pipefail
          : "${APP_STORE_ID:?set repository variable IOS_APP_STORE_ID to your App Store Connect app id}"
          API_PRIVATE_KEYS_DIR="$(dirname "$ASC_KEY_PATH")" \
            xcrun altool --upload-package "$UPLOADED_IPA" \
              --api-key "$ASC_KEY_ID" \
              --api-issuer "$ASC_ISSUER_ID" \
              --wait \
              --output-format json

      - name: Distribute to TestFlight groups
        if: ${{ github.event.inputs.skip_upload != 'true' }}
        env:
          TESTFLIGHT_INTERNAL_GROUP: ${{ vars.TESTFLIGHT_INTERNAL_GROUP || 'Internal' }}
          TESTFLIGHT_EXTERNAL_GROUP: ${{ vars.TESTFLIGHT_EXTERNAL_GROUP }}
        run: |
          set -euo pipefail
          ruby scripts/distribute_testflight_groups.rb \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-path "$ASC_KEY_PATH" \
            --app-id "$APP_STORE_ID" \
            --build-number "$CI_BUILD_NUMBER" \
            --marketing-version "$MARKETING_VERSION" \
            --platform IOS \
            --internal-group "$TESTFLIGHT_INTERNAL_GROUP" \
            --external-group "${TESTFLIGHT_EXTERNAL_GROUP:-}"

      - name: Retain signed IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-signed-ipa
          path: ${{ runner.temp }}/iOSUpload/*.ipa
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary credentials
        if: always()
        run: |
          set -euo pipefail
          [ -n "${ASC_KEY_PATH:-}" ] && rm -f "$ASC_KEY_PATH" || true
          [ -n "${CI_SIGNING_KEYCHAIN:-}" ] && security delete-keychain "$CI_SIGNING_KEYCHAIN" || true
          [ -n "${CI_SIGNING_P12:-}" ] && rm -f "$CI_SIGNING_P12" || true
          rm -f lib/config/secrets.dart ios/Runner/GoogleService-Info.plist
          exit 0
